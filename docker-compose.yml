version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: labsbi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: labsbi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./devops/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - labsbi_network

  backend:
    build: ./backend
    container_name: labsbi_backend
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=72.60.140.128
      - MYSQL_PORT=33060
      - MYSQL_USER=kealabs
      - MYSQL_PASSWORD=Kea2025@!@
      - MYSQL_DATABASE=labsbi_mysql_db
      - SECRET_KEY=your-super-secret-key-here
      - PORT=6002
      - HOST=0.0.0.0
    ports:
      - "0.0.0.0:6002:6002"
    depends_on:
      - mysql
    networks:
      - labsbi_network

  frontend:
    build: ./frontend
    container_name: labsbi_frontend
    environment:
      - REACT_APP_API_URL=http://72.60.140.128:6003
    ports:
      - "0.0.0.0:3002:80"
    depends_on:
      - backend
    networks:
      - labsbi_network

volumes:
  mysql_data:
    driver: local

networks:
  labsbi_network:
    driver: bridge