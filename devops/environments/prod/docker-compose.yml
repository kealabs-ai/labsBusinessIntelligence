version: '3.8'

services:
  backend:
    image: labsbusinessintelligence-backend:latest
    container_name: labsbi_backend_prod
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=labsbi_prod
      - SECRET_KEY=prod-secret-key
      - PORT=6000
      - ENVIRONMENT=prod
    ports:
      - "6000:6000"
    networks:
      - labsbi_prod

  frontend:
    image: labsbusinessintelligence-frontend:latest
    container_name: labsbi_frontend_prod
    environment:
      - REACT_APP_API_URL=http://localhost:6000
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - labsbi_prod

networks:
  labsbi_prod:
    driver: bridge