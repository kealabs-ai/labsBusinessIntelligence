version: '3.8'

services:
  backend:
    image: labsbusinessintelligence-backend:latest
    container_name: labsbi_backend_hml
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=labsbi_hml
      - SECRET_KEY=hml-secret-key
      - PORT=6001
      - ENVIRONMENT=hml
    ports:
      - "6001:6001"
    networks:
      - labsbi_hml

  frontend:
    image: labsbusinessintelligence-frontend:latest
    container_name: labsbi_frontend_hml
    environment:
      - REACT_APP_API_URL=http://localhost:6001
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - labsbi_hml

networks:
  labsbi_hml:
    driver: bridge