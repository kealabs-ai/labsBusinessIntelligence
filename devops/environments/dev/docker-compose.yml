version: '3.8'

services:
  backend:
    image: labsbusinessintelligence-backend:latest
    container_name: labsbi_backend_dev
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=labsbi_dev
      - SECRET_KEY=dev-secret-key
      - PORT=6002
      - ENVIRONMENT=dev
    ports:
      - "6002:6002"
    networks:
      - labsbi_dev

  frontend:
    image: labsbusinessintelligence-frontend:latest
    container_name: labsbi_frontend_dev
    environment:
      - REACT_APP_API_URL=http://localhost:6002
      - PORT=3002
    ports:
      - "3002:3002"
    networks:
      - labsbi_dev

networks:
  labsbi_dev:
    driver: bridge